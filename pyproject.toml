[project]
name = "mirrordash-foreground-theme"
version = "2.0.2"
description = "Seasonal decoration in front of the other modules: snow, Easter, Midsummer, Halloween, birthdays and more, each theme with its own shapes, colours and motion"
requires-python = ">=3.14"
license = "MIT"  # LICENSE: yours to change; the template it came from asks nothing (MIT-0)
license-files = ["LICENSE"]
authors = [
    { name = "Menturan" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations, fastapi); add only what else
# plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
mirrordash_foreground_theme = "mirrordash_foreground_theme.plugin:ForegroundThemeModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",  # the mirror's, for the tests of a module with its own web address
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_foreground_theme"]
